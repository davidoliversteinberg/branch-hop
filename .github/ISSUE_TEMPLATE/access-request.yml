name: Join the shared space
description: Ask to see and share branches in Branch Hop's Shared tab.
title: "Access request"
labels: ["access-request"]
body:
  - type: markdown
    attributes:
      value: |
        Submitting this asks the maintainer to add **your GitHub account** (the one opening this request) to the private `branch-hop-shared` repo, where shared branches live.

        Once approved, GitHub emails you an invite. Accept it, and Branch Hop's Shared tab fills in within a couple of minutes.

        This request is public, so don't add anything private here.
  - type: input
    id: who
    attributes:
      label: Your name and team
      description: So the maintainer knows who's asking.
      placeholder: e.g. Pei, Product Design
    validations:
      required: true
